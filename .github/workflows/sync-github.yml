# Every night: pull fresh repo stats (stars, languages, last push) into src/github.json.
# If anything changed it commits, and the push makes Vercel redeploy the site.
name: Nightly GitHub sync

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC every day
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet src/github.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/github.json
            git commit -m "Nightly GitHub sync"
            git push
          fi
